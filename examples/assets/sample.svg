<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="480" height="360">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ecae6"/>
      <stop offset="100%" stop-color="#e0fbfc"/>
    </linearGradient>
    <radialGradient id="sun">
      <stop offset="0%" stop-color="#ffdd00"/>
      <stop offset="100%" stop-color="#ffba08" stop-opacity="0.9"/>
    </radialGradient>
    <g id="tree">
      <rect x="-3" y="0" width="6" height="18" fill="#7f4f24"/>
      <path d="M0 -34 L16 2 H-16 Z" fill="#2d6a4f"/>
      <path d="M0 -22 L13 8 H-13 Z" fill="#40916c"/>
    </g>
  </defs>

  <rect width="240" height="180" fill="url(#sky)"/>
  <circle cx="196" cy="36" r="22" fill="url(#sun)"/>

  <!-- rolling hills -->
  <path d="M0 120 Q 60 90 120 118 T 240 116 V180 H0 Z" fill="#95d5b2"/>
  <path d="M0 140 Q 80 118 160 142 T 240 138 V180 H0 Z" fill="#74c69d" fill-opacity="0.9"/>

  <!-- winding road: quadratic + arc segments, stroked -->
  <path d="M8 178 Q 60 150 104 156 A 30 30 0 0 0 150 170" fill="none"
        stroke="#6c757d" stroke-width="7" stroke-linecap="round"/>

  <!-- trees via use/transform -->
  <use href="#tree" x="52" y="128"/>
  <use href="#tree" x="86" y="140" transform="scale(0.8)"/>
  <use href="#tree" x="205" y="120" transform="rotate(-4 205 120)"/>

  <!-- windmill with rotated blades -->
  <g transform="translate(150 96)">
    <rect x="-4" y="0" width="8" height="34" fill="#adb5bd"/>
    <g fill="#f8f9fa" stroke="#adb5bd" stroke-width="1">
      <path d="M0 0 L4 -26 H-4 Z"/>
      <path d="M0 0 L4 -26 H-4 Z" transform="rotate(120)"/>
      <path d="M0 0 L4 -26 H-4 Z" transform="rotate(240)"/>
    </g>
    <circle r="3" fill="#495057"/>
  </g>

  <!-- pelican riding a bicycle -->
  <g transform="translate(72 147)">
    <!-- wheels -->
    <g fill="none" stroke="#212529" stroke-width="2">
      <circle cx="0" cy="0" r="9"/>
      <circle cx="26" cy="0" r="9"/>
    </g>
    <circle cx="0" cy="0" r="1.6" fill="#212529"/>
    <circle cx="26" cy="0" r="1.6" fill="#212529"/>
    <!-- frame: chainstay/seat tube triangle, top+down tubes, fork -->
    <g fill="none" stroke="#d62828" stroke-width="1.8">
      <path d="M0 0 L12 -2 L8 -15 Z"/>
      <path d="M12 -2 L22 -15 M8 -15 L22 -15 L26 0"/>
    </g>
    <!-- seat, handlebars, crank and pedals -->
    <path d="M8 -15 L8 -16.5 M5 -16.5 L11 -16.5" fill="none" stroke="#212529" stroke-width="1.6"/>
    <path d="M22 -15 C22 -18 21 -19.5 18 -20" fill="none" stroke="#212529" stroke-width="1.5"/>
    <circle cx="12" cy="-2" r="2.4" fill="none" stroke="#212529" stroke-width="1.2"/>
    <path d="M12 -2 L15 2 M13.5 2 L17.5 2 M12 -2 L9 -6 M7 -6 L11 -6" fill="none" stroke="#212529" stroke-width="1.2"/>
    <!-- the pelican: legs pedaling, wing on the bars, pouch out front -->
    <g stroke="#495057" stroke-width="1" fill="#f8f9fa">
      <path d="M-2 -21 L-9 -27 L0 -25 Z" fill="#dee2e6"/>
      <path d="M8 -19 L12 -9 L15.5 1.5" fill="none" stroke="#f77f00" stroke-width="1.6"/>
      <path d="M7 -19 L8.5 -10 L9 -5.5" fill="none" stroke="#f77f00" stroke-width="1.6"/>
      <ellipse cx="6" cy="-22" rx="8.5" ry="5.5" transform="rotate(-12 6 -22)"/>
      <path d="M10 -25 C15 -25 14 -30 17 -33 L21 -30 C18 -27 17 -23 13 -20 Z"/>
      <path d="M4 -23 C10 -26 14 -22 17.5 -20 L15 -17.5 C10 -17 5.5 -19.5 4 -23 Z" fill="#dee2e6"/>
      <circle cx="20" cy="-34" r="3.2"/>
    </g>
    <path d="M22 -35 L34 -30.5 L23 -30 C22.4 -31.6 22 -33.2 22 -35 Z" fill="#ffb703" stroke="#f77f00" stroke-width="0.8"/>
    <circle cx="20.9" cy="-34.9" r="0.7" fill="#212529"/>
  </g>

  <!-- even-odd donut cloud -->
  <g fill="#ffffff" fill-opacity="0.9">
    <ellipse cx="60" cy="34" rx="26" ry="12"/>
    <ellipse cx="82" cy="28" rx="18" ry="10"/>
  </g>

  <text x="120" y="20" font-size="12" text-anchor="middle" fill="#023047">ntk svg viewer</text>
</svg>
