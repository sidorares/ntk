name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Squash-merge builds the commit from the PR title and description, and a
  # message release-please cannot parse is skipped silently — green workflow,
  # no release PR. That has cost two releases, so it is checked here.
  release-message:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Will release-please be able to read the squash commit?
        # via env, never inline: the body is untrusted text and must not be
        # interpolated into a shell command
        env:
          MESSAGE: |
            ${{ github.event.pull_request.title }}

            ${{ github.event.pull_request.body }}
        run: node scripts/check-release-message.mjs

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18.19 is the engines floor and lacks process.getBuiltinModule
        # (added in 20.16), so it exercises builtin.js's createRequire fallback.
        node: ['18.19', 20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install X11 test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb fontconfig fonts-dejavu-core
      - run: npm ci
      - name: Run tests under Xvfb
        run: xvfb-run -a npm test

  # What the release's publish job does, as far as the upload, and then what
  # an application does with the result. The test jobs install with the npm
  # their Node ships; the publish job upgrades npm first, and the newest npm
  # is what an application installs with. ntk 8.17.2 named a dependency by a
  # tarball's URL: every test job passed, the publish job refused it in
  # `npm ci` (npm 12 fetches no URL or git dependency unless told to), and
  # no application on that npm could have installed it either.
  publishable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm publish --dry-run
      - name: An application installs the package
        run: |
          tarball="$PWD/$(npm pack --silent)"
          mkdir "$RUNNER_TEMP/app" && cd "$RUNNER_TEMP/app"
          npm init -y > /dev/null
          npm install "$tarball"
          node -e "import('ntk/font').then((m) => { if (typeof m.default.fromData !== 'function') process.exit(1); })"

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: website
      - name: Playground demos (pixel-verified) + bundle checks
        run: npm test
        working-directory: website
      - name: Build site
        run: npm run build
        working-directory: website
