name: Release

on:
  push:
    branches: [master]
  # A push that never reaches Actions — a throttled webhook during an incident,
  # say — leaves master with releasable commits and no release PR, and GitHub
  # does not backfill the run it dropped. Dispatch recovers without having to
  # land an empty commit on master.
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create releases and tags
      pull-requests: write # create and update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  publish-npm:
    needs: release-please
    if: needs.release-please.outputs.release_created
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) — no token secret needed
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # trusted publishing requires npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm publish
